[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prevenred"
version = "0.2.0"
description = "Plataforma de Prevención, Monitoreo y Respuesta ante Desastres de Pereira"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymongo>=4.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "motor>=3.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mongomock>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["src/prevenred"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Contratos (puertos ABC) y guardas de tipado no son lógica ejecutable.
exclude_also = [
    '@(abc\.)?abstractmethod',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
